services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"   # solo accesible desde tu máquina
    environment:
      - GENERIC_TIMEZONE=${TZ:-America/Bogota}
      - TZ=${TZ:-America/Bogota}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}   # cifra las credenciales; no lo pierdas
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false                    # solo porque es http://localhost
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/files         # los nodos de archivo solo pueden tocar /files
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all          # nunca perder evidencia de fallos
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all        # trazabilidad: guardamos todo
      - EXECUTIONS_DATA_MAX_AGE=720                # horas (30 días)
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/import/workflows:ro
      - ./credentials:/import/credentials:ro
      - ./audit:/files/audit                       # evidencia: un JSON por lead
    depends_on:
      mailpit:
        condition: service_started
      postgres:
        condition: service_healthy

  # Log de ejecuciones + idempotencia. Mismo SQL que Supabase (db/init.sql).
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=automations
      - POSTGRES_PASSWORD=automations_local      # solo local: el puerto está ligado a 127.0.0.1
      - POSTGRES_DB=automations
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db:/db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automations -d automations"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Buzón SMTP falso: captura TODOS los emails (aprobaciones, alertas) sin enviarlos fuera.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # UI web
      - "127.0.0.1:1025:1025"   # SMTP

volumes:
  n8n_data:
  pg_data:
